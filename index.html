<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>하정철 | 계명대학교 통계학과</title>
    <meta name="description" content="하정철 교수의 연구 및 수업 자료 사이트 - 시계열분석" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="하정철 교수 연구·수업 자료" />
    <meta property="og:title" content="하정철 | 계명대학교 통계학과" />
    <meta property="og:description" content="하정철 교수의 연구 및 수업 자료 사이트 - 시계열분석" />
    <meta property="og:locale" content="ko_KR" />
    <meta name="theme-color" content="#1f2f4d" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <script>
      // 깜빡임 방지: 저장된 테마(없으면 기기 설정)를 먼저 적용
      try {
        var t = localStorage.getItem("theme");
        if (t === "dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
